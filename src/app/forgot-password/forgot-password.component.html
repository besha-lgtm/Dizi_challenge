<div class="forgot-password-container">
  <div class="form-card-wrapper">
    <div class="forgot-password-header">
      <h1>Forgot Password</h1>
      <p class="subtitle">We'll send you an email with instructions to reset your password</p>
    </div>

    <!-- Display form-level error messages -->
    <div *ngIf="formError" class="form-error-message">
      {{ formError }}
    </div>
    <div *ngIf="formSuccess" class="form-success-message">
      {{ formSuccess }}
    </div>

    <!-- Forgot Password Form -->
    <form #forgotPasswordForm="ngForm" (ngSubmit)="onSubmit()" class="forgot-password-form">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">EMAIL ADDRESS</label>
        <div class="input-group">
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="forgotPasswordData.email"
            placeholder="you@example.com"
            required
            email
            #email="ngModel">
        </div>
        <span class="error-message" *ngIf="email.invalid && (email.dirty || email.touched)">
          <span *ngIf="email.errors?.['required']">Email is required</span>
          <span *ngIf="email.errors?.['email']">Invalid email format</span>
        </span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="submit-button"
        [disabled]="forgotPasswordForm.invalid || isLoading">
        <span *ngIf="isLoading" class="loading-spinner"></span>
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading">Sending...</span>
      </button>
    </form>

    <!-- Back to Login Link -->
    <div class="footer-section">
      <span class="back-to-login">
        Remember your password? 
        <a href="#" (click)="goBackToLogin($event)" class="login-link">Back to Sign In</a>
      </span>
    </div>
  </div>
</div>

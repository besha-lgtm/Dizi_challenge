<div class="fp-container">
  <div class="fp-card-wrapper">
    <div class="fp-header">
      <h1>Forgot Password</h1>
      <p class="fp-subtitle">We'll send you an email with instructions to reset your password</p>
    </div>

    <!-- Display form-level error messages -->
    <div *ngIf="formError" class="fp-error-message">
      {{ formError }}
    </div>
    <div *ngIf="formSuccess" class="fp-success-message">
      {{ formSuccess }}
    </div>

    <!-- Forgot Password Form -->
    <form #forgotPasswordForm="ngForm" (ngSubmit)="onSubmit()" class="fp-form">
      <!-- Email Field -->
      <div class="fp-form-group">
        <label for="email">EMAIL ADDRESS</label>
        <div class="fp-input-group">
          <input 
            type="email" 
            id="email" 
            name="email" 
            [(ngModel)]="forgotPasswordData.email"
            placeholder="you@example.com"
            required
            email
            #email="ngModel">
        </div>
        <span class="fp-error-text" *ngIf="email.invalid && (email.dirty || email.touched)">
          <span *ngIf="email.errors?.['required']">Email is required</span>
          <span *ngIf="email.errors?.['email']">Invalid email format</span>
        </span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="fp-submit-btn"
        [disabled]="forgotPasswordForm.invalid || isLoading">
        <span *ngIf="isLoading" class="fp-loading-spinner"></span>
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading">Sending...</span>
      </button>
    </form>

    <!-- Back to Login Link -->
    <div class="fp-footer">
      <span class="fp-back-link">
        Remember your password? 
        <a href="#" (click)="goBackToLogin($event)" class="fp-login-link">Back to Sign In</a>
      </span>
    </div>
  </div>
</div>

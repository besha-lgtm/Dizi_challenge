<app-header></app-header>

<div class="app-layout">

  <!-- SIDEBAR -->
  <div class="sidebar" [class.collapsed]="isCollapsed">

    <!-- Toggle Button -->
    <button class="toggle-btn"
            (click)="toggleSidebar()"
            [title]="isCollapsed ? 'Expand' : 'Collapse'">
      <i class="fa-solid"
         [class.fa-chevron-left]="!isCollapsed"
         [class.fa-chevron-right]="isCollapsed">
      </i>
    </button>

    <!-- USER PROFILE -->
    <div class="user-profile" *ngIf="!isCollapsed">
      <div class="avatar">{{ getUserInitials() }}</div>

      <div class="user-info">
        <div class="user-name">{{ getUserFullName() }}</div>
        <div class="user-sub">{{ getUserSub() }}</div>
        <div class="user-rank">
          <i class="fas fa-medal"></i> Rank #12
        </div>
      </div>
    </div>

    <!-- COLLAPSED AVATAR -->
    <div class="avatar-only" *ngIf="isCollapsed">
      <div class="avatar">{{ getUserInitials() }}</div>
    </div>

    <!-- DIVIDER -->
    <div class="divider"></div>

    <!-- MENU -->
    <nav class="menu">

      <a *ngFor="let item of navItems" 
         [routerLink]="item.route" 
         routerLinkActive="active" 
         [routerLinkActiveOptions]="{ exact: false }"
         (click)="navigateTo(item.route)"
         class="menu-item"
         [title]="isCollapsed ? item.title : ''">
        <i class="fa-solid" [ngClass]="item.icon + ' icon'"></i>
        <span class="label" *ngIf="!isCollapsed">{{ item.label }}</span>
      </a>

    </nav>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content1">
    <router-outlet></router-outlet>
  </div>

</div>

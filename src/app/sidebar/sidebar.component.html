<app-header></app-header>

<div class="app-layout">

  <!-- SIDEBAR -->
  <div class="sidebar" [class.collapsed]="isCollapsed">

    <!-- Toggle Button -->
    <button class="toggle-btn"
            (click)="toggleSidebar()"
            [title]="isCollapsed ? 'Expand' : 'Collapse'">
      <i class="fa-solid"
         [class.fa-chevron-left]="!isCollapsed"
         [class.fa-chevron-right]="isCollapsed">
      </i>
    </button>

    <!-- USER PROFILE -->
    <div class="user-profile" *ngIf="!isCollapsed">
      <div class="avatar">DS</div>

      <div class="user-info">
        <div class="user-name">Deepika Sharma</div>
        <div class="user-sub">Student · ANITS, Visakhapatnam</div>
        <div class="user-rank">
          <i class="fas fa-medal"></i> Rank #12
        </div>
      </div>
    </div>

    <!-- COLLAPSED AVATAR -->
    <div class="avatar-only" *ngIf="isCollapsed">
      <div class="avatar">DS</div>
    </div>

    <!-- DIVIDER -->
    <div class="divider"></div>

    <!-- MENU -->
    <nav class="menu">

      <a routerLink="/dashboard" routerLinkActive="active" class="menu-item"
         [title]="isCollapsed ? 'Dashboard' : ''">
        <i class="fa-solid fa-layer-group icon"></i>
        <span class="label" *ngIf="!isCollapsed">Dashboard</span>
      </a>

      <a routerLink="/explore" routerLinkActive="active" class="menu-item"
         [title]="isCollapsed ? 'Explore Challenges' : ''">
        <i class="fa-solid fa-compass icon"></i>
        <span class="label" *ngIf="!isCollapsed">Explore Challenges</span>
      </a>

      <a routerLink="/teams" routerLinkActive="active" class="menu-item"
         [title]="isCollapsed ? 'My Teams' : ''">
        <i class="fa-solid fa-user-group icon"></i>
        <span class="label" *ngIf="!isCollapsed">My Teams</span>
      </a>

      <a routerLink="/submission" routerLinkActive="active" class="menu-item"
         [title]="isCollapsed ? 'Submissions' : ''">
        <i class="fa-solid fa-cloud-arrow-up icon"></i>
        <span class="label" *ngIf="!isCollapsed">Submissions</span>
      </a>

      <a routerLink="/leaderboard" routerLinkActive="active" class="menu-item"
         [title]="isCollapsed ? 'Leaderboard' : ''">
        <i class="fa-solid fa-trophy icon"></i>
        <span class="label" *ngIf="!isCollapsed">Leaderboard</span>
      </a>

      <a routerLink="/certificates" routerLinkActive="active" class="menu-item"
         [title]="isCollapsed ? 'Certificates' : ''">
        <i class="fa-solid fa-certificate icon"></i>
        <span class="label" *ngIf="!isCollapsed">Certificates</span>
      </a>

      <a routerLink="/settings" routerLinkActive="active" class="menu-item"
         [title]="isCollapsed ? 'Settings' : ''">
        <i class="fa-solid fa-gear icon"></i>
        <span class="label" *ngIf="!isCollapsed">Settings</span>
      </a>

    </nav>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <router-outlet></router-outlet>
  </div>

</div>

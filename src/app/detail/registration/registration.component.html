<div class="modal-overlay" (click)="closeRegistration()">
  <div class="registration-modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Register for Challenge</h2>
      <button class="close-modal" (click)="closeRegistration()">&times;</button>
    </div>
    <div class="modal-body">
      <form (submit)="submitRegistration($event)">
        <div class="form-group">
          <label>Team Name</label>
          <input type="text" placeholder="Enter your team name" required name="teamName">
        </div>
        
        <div class="form-group">
          <label>Team Lead Name</label>
          <input type="text" placeholder="Full Name" required name="teamLead">
        </div>

        <div class="members-section">
          <div class="section-header">
            <label>Team Members</label>
            <button type="button" class="add-member-btn" (click)="addMember()">+ Add Member</button>
          </div>
          
          <div class="member-row" *ngFor="let member of members; let i = index">
            <input type="text" [placeholder]="'Member ' + (i + 1) + ' Name'" [(ngModel)]="members[i].name" [name]="'memberName' + i" required>
            <input type="email" [placeholder]="'Member ' + (i + 1) + ' Email'" [(ngModel)]="members[i].email" [name]="'memberEmail' + i" required>
            <button type="button" class="remove-member" (click)="removeMember(i)" *ngIf="members.length > 1">&times;</button>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="cancel-btn" (click)="closeRegistration()">Cancel</button>
          <button type="submit" class="submit-btn">Complete Registration</button>
        </div>
      </form>
    </div>
  </div>
</div>

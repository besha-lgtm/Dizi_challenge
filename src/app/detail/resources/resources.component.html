<div class="resources-wrapper">

  <!-- Search Section -->
  <div class="res-section res-toolbar-card">
    <div class="res-search-wrap">
      <span class="res-search-icon">🔍</span>
      <input type="text" class="res-search-input" placeholder="Search team files..." [(ngModel)]="searchQuery">
      <button class="res-clear-btn" *ngIf="searchQuery" (click)="searchQuery = ''">✖</button>
    </div>
  </div>

  <!-- Loading State -->
  <div class="res-loading-state" *ngIf="isLoading">
    <div class="res-spinner"></div>
    <p>Fetching team submissions...</p>
  </div>

  <div class="empty-state" *ngIf="!isLoading && filteredSections().length === 0">
    <div class="empty-icon">📂</div>
    <h4 class="empty-title">No submissions found</h4>
    <p class="empty-sub">This challenge doesn't have any team uploads yet.</p>
  </div>

  <div class="res-section" *ngFor="let section of filteredSections()">
    
    <div class="res-section-header">
      <h4 class="res-section-title">{{ section.title }}</h4>
    </div>

    <div class="res-file-grid">
      <div
        class="file-tile res-card-upgrade"
        *ngFor="let file of section.files"
      >
        <div class="file-icon-wrap" [ngClass]="'icon-bg-' + file.type">
          <span class="file-icon">{{ getFileIcon(file.type) }}</span>
        </div>

        <div class="file-info">
          <p class="file-name">{{ file.name }}</p>
          <p class="file-desc">{{ file.desc }}</p>
        </div>

        <div class="file-actions">
          <button class="btn-download" (click)="downloadFile(file)">
            ⬇ Download
          </button>
        </div>
      </div>
    </div>

    <!-- GitHub Link Section -->
    <div class="github-link-section" *ngIf="section.githubUrl">
      <div class="github-card">
        <div class="github-icon">🔗</div>
        <div class="github-info">
          <span class="github-label">GitHub Repository</span>
          <a [href]="section.githubUrl" target="_blank" class="github-url">{{ section.githubUrl }}</a>
        </div>
      </div>
    </div>

  </div>

</div>

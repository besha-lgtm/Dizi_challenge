<app-header></app-header>

<div class="page-wrapper-details">

  <div class="layout-deatils">

    <!-- ════════════════════════════════════════════════════
         LEFT COLUMN — Main content
    ════════════════════════════════════════════════════ -->
    <div class="main-col-detail">

      <!-- ── Header card ─────────────────────────────── -->
      <div class="header-card-detail" *ngIf="challenge">

        <!-- Tags Row (Button removed from here) -->
        <div class="tag-row" id="tagRow">
          <div class="tags-left">
            <span class="tag tag-grey" data-tag>{{ challenge.sector }}</span>
            <span class="tag tag-grey" data-tag>{{ challenge.domain }}</span>
            <span [class]="'tag tag-' + status" id="statusTag">
              {{ getStatusBadge() }}
            </span>
          </div>
        </div>

        <!-- Challenge title -->
        <h1 class="challenge-title-detail" id="challengeTitle">
          {{ challenge.title }}
        </h1>

        <!-- Company · location · posted -->
        <p class="challenge-meta" id="challengeMeta">
          {{ challenge.company_name }} · {{ challenge.location }} · {{ getDaysAgo(challenge.created_at) }}
        </p>

        <!-- Action Buttons: Admin sees Register, User sees Submit -->
        <div class="action-row">
          <!-- ADMIN ONLY: Register for Challenge -->
          <button *ngIf="isAdmin"
            class="register-btn"
            [class.register-btn--disabled]="status === 'upcoming' || status === 'closed'"
            [disabled]="status === 'upcoming' || status === 'closed'"
            (click)="openRegistration()">
            {{ status === 'upcoming' ? 'Registration Opens Soon' : (status === 'closed' ? 'Registration Closed' : 'Register for Challenge') }}
          </button>

          <!-- USER ONLY: Submit to Challenge -->
          <button *ngIf="!isAdmin"
            class="register-btn"
            [class.register-btn--disabled]="status === 'upcoming' || status === 'closed'"
            [disabled]="status === 'upcoming' || status === 'closed'"
            (click)="goToSubmission()">
            {{ status === 'upcoming' ? 'Opens Soon' : (status === 'closed' ? 'Challenge Closed' : 'Submit Solution') }}
          </button>
        </div>

        <!-- Tab bar — uses routerLink + routerLinkActive -->
        <div class="tab-bar" id="tabBar">
          <a routerLink="overview" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Overview</button>
          </a>
          <a routerLink="resources" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Resources</button>
          </a>
          <!-- <a *ngIf="isAdmin" routerLink="discussion" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Discussion</button>
          </a>
          <a *ngIf="isAdmin" routerLink="submissions" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Registered Teams</button>
          </a> -->
          <!-- <a routerLink="resources" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Solutions Hub</button>
          </a> -->
        </div>

      </div><!-- /header-card -->

      <!-- ── Routed tab content renders here ──────────── -->
      <router-outlet></router-outlet>

    </div><!-- /main-col -->
  </div><!-- /layout -->
</div><!-- /page-wrapper -->

<!-- ── Registration Modal ────────────────────────── -->
<app-registration *ngIf="showRegistration" [challengeId]="challengeId" (close)="closeRegistration()">
</app-registration>

<app-header></app-header>

<div class="page-wrapper-details">

  <div class="layout-deatils">

    <!-- ════════════════════════════════════════════════════
         LEFT COLUMN — Main content
    ════════════════════════════════════════════════════ -->
    <div class="main-col-detail">

      <!-- ── Header card ─────────────────────────────── -->
      <div class="header-card-detail">

        <!-- Tags -->
        <div class="tag-row" id="tagRow">
          <span class="tag tag-grey" data-tag>Manufacturing</span>
          <span class="tag tag-grey" data-tag>IoT</span>
          <span class="tag tag-live" id="statusTag">● Live</span>
        </div>

        <!-- Challenge title -->
        <h1 class="challenge-title-detail" id="challengeTitle">
          Reduce Power Loss in Corrugation Plant
        </h1>

        <!-- Company · location · posted -->
        <p class="challenge-meta" id="challengeMeta">
          Visipak Industries · Visakhapatnam · Posted 12 days ago
        </p>

        <!-- Tab bar — uses routerLink + routerLinkActive -->
        <div class="tab-bar" id="tabBar">

          <a routerLink="overview" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Overview</button>
          </a>

          <a routerLink="#" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Files & Resources</button>
          </a>

          <a routerLink="discussion" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Discussion</button>
          </a>

          <a routerLink="#" routerLinkActive="tab-link-active">
            <button class="tab" routerLinkActive="tab-active">Submissions (12)</button>
          </a>

        </div>

      </div><!-- /header-card -->

      <!-- ── Routed tab content renders here ──────────── -->
      <router-outlet></router-outlet>

    </div><!-- /main-col -->
  </div><!-- /layout -->
</div><!-- /page-wrapper -->

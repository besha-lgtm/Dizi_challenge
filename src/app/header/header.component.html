<header class="navbar" *ngIf="isAuthenticated()">

  <!-- LEFT LOGO -->
  <div class="logo">
    <img src="assets/images/Logo-bg.png" alt="DIZI Edutech Logo" class="main-logo" (click)="goToHome()"
      style="cursor: pointer;">
  </div>

  <!-- NAV LINKS (Desktop) -->
  <nav class="nav-links">
    <a *ngIf="isAdmin()" routerLink="/home" routerLinkActive="active">Home</a>
    <a routerLink="/challenges" routerLinkActive="active">Challenges</a>
    <a *ngIf="isAdmin()" routerLink="/postchallenge" routerLinkActive="active">Post Challenge</a>
    <a routerLink="/submission" routerLinkActive="active">Submission</a>
    <a *ngIf="isAdmin()" routerLink="/evaluation" routerLinkActive="active">Evaluation</a>
    <a routerLink="/leaderboard" routerLinkActive="active">Leaderboard</a>
  </nav>

  <!-- RIGHT SIDE (Desktop) -->
  <div class="nav-actions">
    <div class="profile-container">
      <div class="profile" (click)="onProfileClick($event)" title="Profile">{{ getInitials() }}</div>
      <!-- Profile Dropdown -->
      <div class="profile-dropdown" [class.active]="profileDropdownOpen">
        <button class="dropdown-item" (click)="signOut(); $event.stopPropagation()">
          <i class="fas fa-sign-out-alt"></i>
          <span>Sign Out</span>
        </button>
      </div>
    </div>
  </div>

  <!-- HAMBURGER BUTTON (Mobile/Tablet) -->
  <button class="hamburger" [class.active]="menuOpen" (click)="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- MOBILE OVERLAY MENU -->
  <div class="overlay-menu" [class.active]="menuOpen">
    <!-- Close Button -->
    <button class="close-btn" (click)="toggleMenu()">
      <span class="close-icon">×</span>
    </button>

    <!-- Profile Avatar at Top -->
    <div class="overlay-profile">
      <div class="profile-avatar">{{ getInitials() }}</div>
      <span class="profile-label">Profile</span>
    </div>

    <!-- Mobile Nav Links -->
    <nav class="mobile-nav-links">
      <a *ngIf="isAdmin()" routerLink="/home" routerLinkActive="active" (click)="toggleMenu()">Home</a>
      <a routerLink="/challenges" routerLinkActive="active" (click)="toggleMenu()">Challenges</a>
      <a *ngIf="isAdmin()" routerLink="/postchallenge" routerLinkActive="active" (click)="toggleMenu()">Post Challenge</a>
      <a routerLink="/submission" routerLinkActive="active" (click)="toggleMenu()">Submission</a>
      <a *ngIf="isAdmin()" routerLink="/evaluation" routerLinkActive="active" (click)="toggleMenu()">Evaluation</a>
      <a routerLink="/leaderboard" routerLinkActive="active" (click)="toggleMenu()">Leaderboard</a>
    </nav>

    <!-- Mobile Sign Out Button -->
    <div class="mobile-signout">
      <button class="btn-signout" (click)="signOut(); $event.stopPropagation()">
        <i class="fas fa-sign-out-alt"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </div>

  <!-- Overlay Backdrop -->
  <div class="overlay-backdrop" [class.active]="menuOpen" (click)="toggleMenu()"></div>
</header>
